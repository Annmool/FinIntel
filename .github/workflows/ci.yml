name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test -- --watchAll=false --runInBand
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm audit --omit=dev --audit-level=high
        working-directory: client

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Start a disposable MongoDB replica set
        timeout-minutes: 3
        run: |
          docker run --rm -d --name finintel-mongo-test -p 127.0.0.1:27018:27018 mongo:8.0.16 --replSet rs0 --port 27018 --bind_ip_all
          for attempt in {1..30}; do
            docker exec finintel-mongo-test mongosh --quiet --port 27018 --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27018"}]})' >/dev/null 2>&1 || true
            if docker exec finintel-mongo-test mongosh --quiet --port 27018 --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
              exit 0
            fi
            sleep 1
          done
          docker logs finintel-mongo-test
          exit 1
      - run: npm run test:integration
        working-directory: server
      - run: npm audit --audit-level=moderate
        working-directory: server
      - run: npm run build
        working-directory: server
